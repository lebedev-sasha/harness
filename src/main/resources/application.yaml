spring:
  application:
    name: harness
  main:
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url: http://localhost:11431
      chat:
        think: false
        temperature: 0.2
        model: qwen3.5:4b

harness:
  agent:
    max-turns: 20
    workspace-root: .

logging:
  level:
    root: WARN
    com.harness: INFO
  pattern:
    console: "%msg%n"